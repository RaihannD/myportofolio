
<button type="button"
        class="button button-danger"
        popovertarget="delete-experience-{{ experience.id }}"
        aria-label="Hapus {{ experience.title }}"
        title="Hapus pengalaman">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-trash-fill" viewBox="0 0 16 16">
        <path d="M2.5 1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1H3v9a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V4h.5a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H10a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1zm3 4a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 .5-.5M8 5a.5.5 0 0 1 .5.5v7a.5.5 0 0 1-1 0v-7A.5.5 0 0 1 8 5m3 .5v7a.5.5 0 0 1-1 0v-7a.5.5 0 0 1 1 0"/>
    </svg>
</button>

<div id="delete-experience-{{ experience.id }}"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-experience-title-{{ experience.id }}">

    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-experience-{{ experience.id }}"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>

    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-experience-{{ experience.id }}"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>

        <h2 id="delete-experience-title-{{ experience.id }}">
            Hapus Pengalaman?
        </h2>

        <p>
            Apakah Anda yakin ingin menghapus
            <strong>{{ experience.title }}</strong>?
        </p>

        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-experience-{{ experience.id }}"
                    popovertargetaction="hide">
                Batal
            </button>

            <form method="post"
                  action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">
                    Ya, Hapus
                </button>
            </form>
        </div>
    </div>
</div>
